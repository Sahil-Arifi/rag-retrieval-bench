name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"

    env:
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      TOKENIZERS_PARALLELISM: "false"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync frozen environment
        run: uv sync --frozen --python ${{ matrix.python-version }} --group dev

      - name: Smoke-test binary dependencies
        run: >-
          uv run --frozen python -c
          "import faiss, numpy, torch;
          print(f'faiss={faiss.__version__} numpy={numpy.__version__} torch={torch.__version__}')"

      - name: Run Ruff
        run: uv run --frozen ruff check .

      - name: Run tests
        run: uv run --frozen pytest
