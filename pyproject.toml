[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "rag-retrieval-bench"
version = "0.1.0"
description = "Reproducible benchmarking harness for measuring how chunking and embedding choices affect RAG retrieval quality."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Sahil Arifi" }]
dependencies = [
    "faiss-cpu>=1.15.0,<1.16",
    "matplotlib>=3.11.1,<3.12",
    "numpy>=2.4.3,<2.5",
    "pandas>=3.0.5,<3.1",
    "pydantic>=2.13.4,<3",
    "pyyaml>=6.0.3,<7",
    "rich>=15.0.0,<16",
    "sentence-transformers>=6.0.0,<6.1",
    "torch>=2.13.0,<2.14",
    "typer>=0.27.1,<0.28",
]

[project.scripts]
retrieval-bench = "retrieval_bench.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.4,<0.17",
]

[tool.uv]
required-version = "==0.12.5"
prerelease = "disallow"
fork-strategy = "fewest"
environments = [
    "implementation_name == 'cpython' and sys_platform == 'linux' and python_version < '3.15'",
    "implementation_name == 'cpython' and sys_platform == 'win32' and python_version < '3.15'",
]
required-environments = [
    "implementation_name == 'cpython' and sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
    "implementation_name == 'cpython' and sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "implementation_name == 'cpython' and sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.11'",
    "implementation_name == 'cpython' and sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_bench"]

[tool.pytest.ini_options]
addopts = "--cov=retrieval_bench --cov-report=term-missing --cov-report=xml --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
